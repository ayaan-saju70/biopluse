<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="walkBugBody" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="70%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <linearGradient id="shoeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground Shadows -->
  <ellipse cx="400" cy="890" rx="140" ry="26" fill="#1E293B" opacity="0.12"/>
  <ellipse cx="660" cy="860" rx="130" ry="24" fill="#1E293B" opacity="0.10"/>

  <!-- Back Leg & Big Sneaker (Stepping) -->
  <g transform="translate(620 720) rotate(-12)">
    <rect x="-24" y="0" width="48" height="90" rx="20" fill="#FDE68A" stroke="#2D4B5A" stroke-width="12"/>
    <!-- Chunky Sneaker -->
    <path d="M -50 80 L 70 80 Q 95 80 100 105 L 100 130 Q 100 150 70 150 L -60 150 Q -90 150 -90 120 L -80 95 Q -70 80 -50 80 Z" fill="url(#shoeGrad)" stroke="#2D4B5A" stroke-width="12" stroke-linejoin="round"/>
    <rect x="-95" y="145" width="200" height="24" rx="10" fill="#FFFDF7" stroke="#2D4B5A" stroke-width="10"/>
    <circle cx="50" cy="115" r="14" fill="#FDE68A"/>
  </g>

  <!-- Chubby Body -->
  <g filter="url(#softShadow)">
    <circle cx="512" cy="500" r="230" fill="url(#walkBugBody)" stroke="#2D4B5A" stroke-width="14"/>
  </g>

  <!-- Belly Patch -->
  <circle cx="512" cy="540" r="150" fill="#FFFDF7" opacity="0.88"/>

  <!-- Antenna with Star -->
  <path d="M 512 270 Q 512 160 512 140" fill="none" stroke="#2D4B5A" stroke-width="14" stroke-linecap="round"/>
  <!-- Cute bouncing star -->
  <polygon points="512,80 528,125 575,125 537,152 552,198 512,170 472,198 487,152 449,125 496,125" fill="#FDE68A" stroke="#2D4B5A" stroke-width="10" stroke-linejoin="round"/>

  <!-- Cute Eyes -->
  <g>
    <!-- Left Eye -->
    <ellipse cx="430" cy="460" rx="36" ry="48" fill="#2D4B5A"/>
    <circle cx="444" cy="442" r="14" fill="#FFFFFF"/>
    <circle cx="422" cy="480" r="6" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <ellipse cx="594" cy="460" rx="36" ry="48" fill="#2D4B5A"/>
    <circle cx="608" cy="442" r="14" fill="#FFFFFF"/>
    <circle cx="586" cy="480" r="6" fill="#FFFFFF"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="365" cy="510" rx="30" ry="18" fill="#FB7185" opacity="0.6"/>
    <ellipse cx="659" cy="510" rx="30" ry="18" fill="#FB7185" opacity="0.6"/>

    <!-- Mischievous Happy Open Smile -->
    <path d="M 466 515 Q 512 575 558 515 Z" fill="#FB7185" stroke="#2D4B5A" stroke-width="12" stroke-linejoin="round"/>
  </g>

  <!-- Little Swinging Hands -->
  <circle cx="280" cy="530" r="38" fill="#A7F3D0" stroke="#2D4B5A" stroke-width="12"/>
  <circle cx="744" cy="530" r="38" fill="#A7F3D0" stroke="#2D4B5A" stroke-width="12"/>

  <!-- Front Leg & Big Sneaker (Forward Step) -->
  <g transform="translate(390 730) rotate(8)">
    <rect x="-24" y="0" width="48" height="90" rx="20" fill="#FDE68A" stroke="#2D4B5A" stroke-width="12"/>
    <!-- Chunky Sneaker -->
    <path d="M -50 80 L 70 80 Q 95 80 100 105 L 100 130 Q 100 150 70 150 L -60 150 Q -90 150 -90 120 L -80 95 Q -70 80 -50 80 Z" fill="url(#shoeGrad)" stroke="#2D4B5A" stroke-width="12" stroke-linejoin="round"/>
    <rect x="-95" y="145" width="200" height="24" rx="10" fill="#FFFDF7" stroke="#2D4B5A" stroke-width="10"/>
    <circle cx="50" cy="115" r="14" fill="#FDE68A"/>
  </g>

  <!-- Footstep Motion Lines -->
  <path d="M 230 890 Q 280 870 330 890" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round"/>
  <path d="M 720 850 Q 770 830 820 850" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round"/>
</svg>