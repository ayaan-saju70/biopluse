<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="ballGlow" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFED4A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Motion trail dots -->
  <circle cx="20" cy="78" r="7" fill="#FDE68A" opacity="0.6"/>
  <circle cx="32" cy="72" r="10" fill="#F59E0B" opacity="0.8"/>
  <!-- Main bouncy ball -->
  <circle cx="56" cy="46" r="36" fill="url(#ballGlow)" stroke="#1E293B" stroke-width="4" filter="url(#shadow)"/>
  <!-- Highlight shine -->
  <ellipse cx="44" cy="30" rx="14" ry="8" transform="rotate(-30 44 30)" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="68" cy="48" r="4" fill="#FFFFFF" opacity="0.6"/>
</svg>
