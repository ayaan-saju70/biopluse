<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="phoneBugBody" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="65%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="512" cy="870" rx="220" ry="34" fill="#1E293B" opacity="0.12"/>

  <!-- Feet -->
  <g fill="#FDE68A" stroke="#2D4B5A" stroke-width="12">
    <ellipse cx="400" cy="820" rx="46" ry="30"/>
    <ellipse cx="624" cy="820" rx="46" ry="30"/>
  </g>

  <!-- Chubby Body -->
  <g filter="url(#softShadow)">
    <ellipse cx="512" cy="540" rx="230" ry="250" fill="url(#phoneBugBody)" stroke="#2D4B5A" stroke-width="14"/>
  </g>

  <!-- Phone Screen on Belly -->
  <rect x="372" y="440" width="280" height="260" rx="40" fill="#FFFDF7" stroke="#2D4B5A" stroke-width="12"/>
  <!-- Home pill indicator -->
  <rect x="472" y="665" width="80" height="14" rx="7" fill="#CBD5E1"/>

  <!-- Antenna with Glowing Ring Waves -->
  <path d="M 512 290 L 512 180" fill="none" stroke="#2D4B5A" stroke-width="14" stroke-linecap="round"/>
  <circle cx="512" cy="180" r="26" fill="#FB7185" stroke="#2D4B5A" stroke-width="12"/>

  <!-- Signal Waves radiating from antenna -->
  <path d="M 440 160 A 90 90 0 0 1 584 160" fill="none" stroke="#FB7185" stroke-width="10" stroke-linecap="round"/>
  <path d="M 390 120 A 150 150 0 0 1 634 120" fill="none" stroke="#FDE68A" stroke-width="10" stroke-linecap="round"/>
  <path d="M 340 80 A 210 210 0 0 1 684 80" fill="none" stroke="#34D399" stroke-width="10" stroke-linecap="round"/>

  <!-- Face on the Screen -->
  <g>
    <!-- Left Winking Eye -->
    <path d="M 430 520 Q 455 500 480 520" fill="none" stroke="#2D4B5A" stroke-width="12" stroke-linecap="round"/>

    <!-- Right Big Eye -->
    <ellipse cx="560" cy="515" rx="28" ry="38" fill="#2D4B5A"/>
    <circle cx="570" cy="502" r="10" fill="#FFFFFF"/>
    <circle cx="552" cy="530" r="5" fill="#FFFFFF"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="420" cy="565" rx="22" ry="14" fill="#FB7185" opacity="0.6"/>
    <ellipse cx="604" cy="565" rx="22" ry="14" fill="#FB7185" opacity="0.6"/>

    <!-- Happy Smile -->
    <path d="M 486 565 Q 512 595 538 565" fill="none" stroke="#2D4B5A" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Little Hands holding side of the phone -->
  <circle cx="340" cy="570" r="32" fill="#E0F2FE" stroke="#2D4B5A" stroke-width="12"/>
  <circle cx="684" cy="570" r="32" fill="#E0F2FE" stroke="#2D4B5A" stroke-width="12"/>

  <!-- Musical Notification Beeps -->
  <g fill="#FDE68A" stroke="#2D4B5A" stroke-width="6">
    <!-- Note 1 -->
    <circle cx="750" cy="380" r="16"/>
    <rect x="758" y="330" width="10" height="50" rx="4"/>
    <!-- Note 2 -->
    <circle cx="270" cy="400" r="16"/>
    <rect x="278" y="350" width="10" height="50" rx="4"/>
  </g>
</svg>